[loggers]
keys=root,socrates_server

[handlers]
keys=stdout,stderr,fileServ

[formatters]
keys=simple

[logger_root]
level=NOTSET
handlers=

[logger_socrates_server]
level=DEBUG
handlers=stderr,stdout,fileServ
qualname=socrates_server

[handler_stdout]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_stderr]
class=StreamHandler
level=ERROR
formatter=simple
args=(sys.stderr,)

[handler_fileServ]
class=FileHandler
formatter=simple
args=('logs/front_serv_%(date)s.log','a')

[formatter_simple]
format=%(asctime)s %(name)-12s %(levelname)-8s %(message)s
