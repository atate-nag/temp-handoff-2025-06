[loggers]
keys=root, socrates_front

[handlers]
keys=stdout,stderr,fileFront

[formatters]
keys=simple

[logger_root]
level=NOTSET
handlers= 

[logger_socrates_front]
level=DEBUG
handlers=stderr,stdout,fileFront
qualname=socrates_front

[handler_stdout]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_stderr]
class=StreamHandler
level=ERROR
formatter=simple
args=(sys.stderr,)

[handler_fileFront]
class=FileHandler
formatter=simple
args=('logs/front_app_%(date)s.log','a')

[formatter_simple]
format=%(asctime)s %(name)-12s %(levelname)-8s %(message)s
