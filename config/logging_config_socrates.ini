[loggers]
keys=root,socrates_main

[handlers]
keys=stdout,stderr,file

[formatters]
keys=simple

[logger_root]
level=NOTSET
handlers=

[logger_socrates_main]
level=DEBUG
handlers=stderr,stdout,file
qualname=socrates_main

[handler_stdout]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_stderr]
class=StreamHandler
level=ERROR
formatter=simple
args=(sys.stderr,)

[handler_file]
class=FileHandler
formatter=simple
args=('logs/app_%(date)s.log','a')

[formatter_simple]
format=%(asctime)s %(name)-12s %(levelname)-8s %(message)s
